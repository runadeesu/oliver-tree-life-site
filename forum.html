<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>Oliver Tree — Fan Forum</title><link rel="stylesheet" href="assets/style.css"></head><body data-page="forum"><header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html">OT / LIFE</a><nav class="nav"><a href="index.html" data-page="home" data-i18n="nav.home"></a><a href="timeline.html" data-page="timeline" data-i18n="nav.timeline"></a><a href="music.html" data-page="music" data-i18n="nav.music"></a><a href="videos.html" data-page="videos" data-i18n="nav.videos"></a><a href="photos.html" data-page="photos" data-i18n="nav.photos"></a><a href="forum.html" data-page="forum" data-i18n="nav.forum"></a><a href="sources.html" data-page="sources" data-i18n="nav.sources"></a></nav>

<section class="page-hero"><div class="label">COMMUNITY</div><h1 data-i18n="forum.title"></h1><p data-i18n="forum.lede"></p></section>
<section class="section">
 <div id="forumMessage" class="notice" hidden></div>
 <div class="forum-layout">
  <div>
   <div class="section-head"><div><div class="label" data-i18n="forum.latest"></div><h2 style="font-size:48px">COMMUNITY</h2></div><button id="refreshBtn" class="btn" data-i18n="forum.refresh"></button></div>
   <div class="toolbar">
    <button class="pill active" data-cat-filter="all" data-i18n="all"></button><button class="pill" data-cat-filter="general" data-i18n="cat.general"></button><button class="pill" data-cat-filter="music" data-i18n="cat.music"></button><button class="pill" data-cat-filter="era" data-i18n="cat.era"></button><button class="pill" data-cat-filter="live" data-i18n="cat.live"></button><button class="pill" data-cat-filter="photos" data-i18n="cat.photos"></button><button class="pill" data-cat-filter="questions" data-i18n="cat.questions"></button>
   </div>
   <div class="form-row"><label data-i18n="forum.filterLang"></label><select id="languageFilter" class="select"><option value="all">ALL</option><option value="ja">日本語</option><option value="en">English</option><option value="es">Español</option><option value="ru">Русский</option></select></div>
   <div id="forumList" class="forum-list"><div class="loading" data-i18n="status.loading"></div></div>
   <div id="postDetail"></div>
  </div>
  <aside class="sidebar">
   <div class="side-card"><h3 data-i18n="forum.createPost"></h3><div class="notice" data-i18n="forum.guestNotice"></div>
    <form id="postForm" style="margin-top:16px">
      <div class="form-row"><label data-i18n="forum.name"></label><input id="postName" class="input" maxlength="32"><div class="help" data-i18n="forum.nameHelp"></div></div>
      <div class="form-row"><label data-i18n="forum.postTitle"></label><input id="postTitle" class="input" minlength="3" maxlength="120" required></div>
      <div class="form-row"><label data-i18n="forum.body"></label><textarea id="postBody" class="textarea" maxlength="5000" required></textarea></div>
      <div class="form-row"><label data-i18n="forum.category"></label><select id="postCategory" class="select"><option value="general" data-i18n="cat.general"></option><option value="music" data-i18n="cat.music"></option><option value="era" data-i18n="cat.era"></option><option value="live" data-i18n="cat.live"></option><option value="photos" data-i18n="cat.photos"></option><option value="questions" data-i18n="cat.questions"></option></select></div>
      <div class="form-row"><label data-i18n="forum.postLang"></label><select id="postLanguage" class="select"><option value="ja">日本語</option><option value="en">English</option><option value="es">Español</option><option value="ru">Русский</option></select></div>
      <button id="publishBtn" class="btn primary" data-i18n="forum.publish"></button>
    </form>
   </div>
  </aside>
 </div>
</section>
</main><footer class="footer"><div class="footer-inner"><div>OLIVER TREE — LIFE ARCHIVE</div><div data-i18n="footer"></div></div></footer><script type="module" src="assets/forum.js"></script></body></html>
